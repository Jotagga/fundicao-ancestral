plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	// Loom adds the repositories needed for Minecraft, Fabric and their libraries.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"ancient_foundry" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Server-side game tests live in src/gametest. `./gradlew runGameTest` starts a test server,
// runs them and stops; `./gradlew build` runs them too (through `check`).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "ancient_foundry_gametest"
		enableGameTests = true
		enableClientGameTests = false
	}
}

loom {
	runs {
		gameTest {
			property "fabric-api.gametest.report-file", layout.buildDirectory.file("gametest-report.xml").get().asFile.absolutePath
		}
	}
}

// A scripted run of the real client lives in src/clienttest: it loads a flat world, builds a
// foundry, checks models/textures/translations and saves screenshots. Start it with
// `./gradlew runClientTest`; it is not part of `build` and is not shipped in the jar.
sourceSets {
	clienttest {
		compileClasspath += sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.main.output + sourceSets.client.output
	}
}

configurations {
	clienttestCompileClasspath.extendsFrom(compileClasspath, clientCompileClasspath)
	clienttestRuntimeClasspath.extendsFrom(runtimeClasspath, clientRuntimeClasspath)
}

loom {
	mods {
		"ancient_foundry_clienttest" {
			sourceSet sourceSets.clienttest
		}
	}

	runs {
		clientTest {
			client()
			source sourceSets.clienttest
			runDir "build/run/clientTest"
			property "ancientfoundry.clienttest", "true"
			programArgs "--width", "1280", "--height", "720"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Plain unit tests for the game-independent logic (src/test).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()

	testLogging {
		events "passed", "failed", "skipped"
		showStandardStreams = true
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Gradle runs on Java 25 (Loom needs it) but Minecraft 1.21.1 is played on Java 21. Passing
// -PgameJavaVersion=21 launches the game tasks (runClient, runServer, runGameTest) on a Java 21
// toolchain, which is what CI does.
def gameJavaVersion = providers.gradleProperty("gameJavaVersion")

if (gameJavaVersion.present) {
	def gameLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(gameJavaVersion.get() as int)
	}

	tasks.withType(JavaExec).configureEach {
		javaLauncher = gameLauncher
	}
}
